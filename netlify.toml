# Instrucciones para Netlify: cómo construir y publicar la web.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Que Google no muestre el panel ni la página de "gracias"
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/gracias/*"
  [headers.values]
    X-Robots-Tag = "noindex"
